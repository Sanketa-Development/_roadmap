name: Publish roadmap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir _site
          cp -R index.html assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Wait for uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in {1..12}; do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == env.PAGES_ARTIFACT and .expired == false) | .id')
            if [ "$artifact_id" = "$EXPECTED_ARTIFACT_ID" ]; then
              exit 0
            fi
            sleep 5
          done
          echo 'Uploaded Pages artifact did not appear in the deployment API.' >&2
          exit 1
      - name: Deploy Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            // Use the upload result directly: the artifact service used by
            // deploy-pages can disagree with REST or include prior attempts.
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: Number(process.env.PAGES_ARTIFACT_ID),
              pages_build_version: context.sha,
              oidc_token: idToken
            });
            const deploymentId = deployment.id || deployment.status_url.split('/').pop();
            core.setOutput('page_url', deployment.page_url);
            const failed = new Set(['deployment_failed', 'deployment_perms_error',
              'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 60; ++attempt) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const {data: state} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...context.repo, deployment_id: deploymentId
              });
              if (state.status === 'succeed') return;
              if (failed.has(state.status)) throw new Error(`Pages deployment: ${state.status}`);
            }
            throw new Error('Pages deployment timed out after five minutes.');
